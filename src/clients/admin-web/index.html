<!doctype html>
<!-- Light mode is locked (CONTRACT.md §8, founder decision D1 2026-08-31).
     `data-mode="light"` is a declaration of that lock, not a switch: there is
     no toggle, no persisted preference and no dark palette in globals.css. -->
<html lang="en" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Was `width=1280`, which made the console desktop-only by construction:
         a laptop at 1024 got a horizontally-scrolled 1280 page it could not
         reflow. v3 is responsive down to 1023 and below. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AgriSync Admin · operations console" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- DM Sans = English, brand and numbers. Noto Sans Devanagari = Marathi
         body text. Both are charter rules, not preferences.

         JetBrains Mono STAYS after Task 27. The count it was waiting on was
         re-measured with all thirteen screens ported: SIX files, EIGHTEEN
         uses of `font-mono`, not the 20 screens this comment used to claim.
         They are deliberate choices made during the port — the OTP field, the
         farmer-search field, error timestamps and status codes, and five
         <code> spans naming a module, a route, two ssf tables and a version
         hash — on surfaces read character by character. CONTRACT.md §8 bans monospace, so this is a live
         disagreement between the contract and six shipped files, and it
         is the founder's call, not a sweep. See globals.css §A.1. -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>AgriSync Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
