<!doctype html>
<!-- Light mode is locked (CONTRACT.md §8, founder decision D1 2026-08-31).
     `data-mode="light"` is a declaration of that lock, not a switch: there is
     no toggle, no persisted preference and no dark palette in globals.css. -->
<html lang="en" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Was `width=1280`, which made the console desktop-only by construction:
         a laptop at 1024 got a horizontally-scrolled 1280 page it could not
         reflow. v3 is responsive down to 1023 and below. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AgriSync Admin · operations console" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- FOUR FAMILIES, AND ONE OF THEM IS A DIVERGENCE FROM THE PROJECT FONT
         RULE. Stated here as well as in globals.css §A.1, because this tag is
         what actually makes a face exist and a stylesheet naming a font that
         was never loaded is a silent failure — Task 6 proved that shape: 20 of
         23 tests still passed with the Devanagari face deleted, because they
         asserted the CSS and not the `<link>`.

           Nunito Sans           prose and UI text. Added 2026-09-02 on the
                                 founder's instruction "change the font make
                                 it more friendly to read". Root CLAUDE.md
                                 says English is DM Sans; this is his call and
                                 it is one line to revert.
           DM Sans               headings, the brand mark, KPI figures, table
                                 headers, Latin person names. The brand voice,
                                 unchanged.
           Noto Sans Devanagari  Marathi. NON-NEGOTIABLE. Farmer names render
                                 in it. It is second in both Latin stacks so a
                                 mixed string resolves without a per-component
                                 check.
           JetBrains Mono        STAYS after Task 27. Re-measured with all
                                 thirteen screens ported: SIX files, EIGHTEEN
                                 uses — the OTP field, the farmer-search field,
                                 error timestamps and status codes, and five
                                 <code> spans. Every one is a value read
                                 character by character. CONTRACT.md §8 bans
                                 monospace, so this is a live disagreement
                                 between the contract and six shipped files,
                                 and it is the founder's call, not a sweep. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>AgriSync Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
