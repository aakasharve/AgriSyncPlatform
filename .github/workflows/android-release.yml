name: android-release

on:
  # NOTE: there is deliberately no `version_bump` input. One used to be declared
  # here and no step ever read it, so choosing "patch" in the Run-workflow dialog
  # silently did nothing. The version is a COMMIT: edit versionCode / versionName
  # in src/clients/mobile-web/android/app/build.gradle and push that.
  #
  # RELEASE 1.0.13: no `push: tags: v*` trigger any more, and no web build here.
  # The APK is built ONLY from the web bundle that web-release.yml already
  # produced and published (artifact `web-dist`), so the two clients ship the
  # same bytes. A tag push cannot name that run, so it can no longer start this
  # workflow. Dispatch it from the SAME commit as the web run, passing its id.
  workflow_dispatch:
    inputs:
      web_run_id:
        description: 'Run id of the SUCCESSFUL web-release run (same commit) whose web-dist bundle this APK embeds'
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    name: Build & publish signed APK (private)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/clients/mobile-web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      # Use the pre-installed Android SDK on ubuntu-latest
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install sync-contract deps (tolerant — lock omits Linux-only @emnapi optional deps)
        working-directory: sync-contract
        run: npm install --no-audit --no-fund

      - name: Install mobile-web deps
        working-directory: src/clients/mobile-web
        run: npm ci

      # The web assets are NOT rebuilt here. They are the exact bundle web-release
      # published, bound to this commit and to a successful run.
      - name: Verify the web run this APK will embed
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_RUN_ID: ${{ inputs.web_run_id }}
        run: |
          set -euo pipefail
          INFO=$(gh run view "$WEB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,headSha,workflowName -q '[.workflowName,.conclusion,.headSha]|@tsv')
          IFS=$'\t' read -r WF CONCL HEAD <<< "$INFO"
          [ "$WF" = "web-release" ]   || { echo "::error::run $WEB_RUN_ID is '$WF', not web-release"; exit 1; }
          [ "$CONCL" = "success" ]    || { echo "::error::web-release run $WEB_RUN_ID did not succeed ($CONCL)"; exit 1; }
          [ "$HEAD" = "$GITHUB_SHA" ] || { echo "::error::web run built $HEAD but this APK is $GITHUB_SHA - they must be the same commit"; exit 1; }
          echo "web-release run $WEB_RUN_ID succeeded on $HEAD"

      - name: Download the published web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: src/clients/mobile-web
          run-id: ${{ inputs.web_run_id }}
          github-token: ${{ github.token }}

      - name: Verify the bundle is byte-identical to what web-release hashed
        working-directory: src/clients/mobile-web
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check --strict --quiet ../web-dist.sha256)
          test "$(cd dist && find . -type f | wc -l)" = "$(wc -l < web-dist.sha256)" \
            || { echo "::error::dist/ holds files the manifest does not list"; exit 1; }
          echo "dist/ matches the manifest ($(wc -l < web-dist.sha256) files)"

      - name: Cap sync android
        working-directory: src/clients/mobile-web
        run: npx cap sync android

      # Bundle identity inside the APK input: every file the web job hashed must
      # exist, unchanged, in the Android assets that Gradle packages.
      - name: Verify the Android assets carry the same bundle
        run: |
          set -euo pipefail
          cd src/clients/mobile-web/android/app/src/main/assets/public
          sha256sum --check --strict --quiet "$GITHUB_WORKSPACE/src/clients/mobile-web/web-dist.sha256"
          echo "android assets match the web manifest"

      # The signing key is NOT in the repo — it is this secret plus the founder's
      # offline backup. Everything below is a guard, because every failure mode
      # here used to surface hundreds of Gradle tasks later as a misleading
      # "keystore password was incorrect", or not at all.
      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS=src/clients/mobile-web/android/app/shramsafal-release.keystore
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          SZ=$(wc -c < "$KS")
          echo "Keystore decoded: ${SZ} bytes"
          # `base64 -d` exits 0 on an empty or unset secret and writes a 0-byte
          # file. Without this check that becomes a Gradle error 500 tasks later.
          if [ "$SZ" -lt 1000 ]; then
            echo "::error title=KEYSTORE_BASE64 empty or truncated::Decoded keystore is ${SZ} bytes. Regenerate with 'base64 -w0 <keystore>' and reset the KEYSTORE_BASE64 secret."
            exit 1
          fi
          # app/build.gradle defaults these to "" when unset, which produces the
          # same misleading downstream error as a wrong password.
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error title=Signing password secret missing::KEYSTORE_PASSWORD and/or KEY_PASSWORD is unset."
            exit 1
          fi
          # Catches a half-finished key rotation (new keystore, old password) in
          # seconds rather than at the end of a 20-minute build. The alias is
          # fixed by app/build.gradle.
          #
          # keytool writes its failure diagnostic to STDOUT, not stderr, so the
          # earlier `> /dev/null` form silently discarded the one line that says
          # what went wrong — leaving a bare non-zero exit and making this the
          # only guard here without a named message. Capture it instead.
          if ! KT_OUT=$(keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias shramsafal 2>&1); then
            echo "::error title=Keystore does not match KEYSTORE_PASSWORD::${KT_OUT}"
            exit 1
          fi
          echo "Keystore opens with the supplied password, and contains alias 'shramsafal'."

      - name: Grant Gradle execute permission
        working-directory: src/clients/mobile-web/android
        run: chmod +x gradlew

      # The APK is built and published ALONE, before the Play bundle is even
      # attempted. `-q` is deliberately not used: it hides which task failed.
      #
      # These were briefly one command (`assembleRelease bundleRelease`) with a
      # comment claiming a bundle problem could never block the APK. That was
      # false: no step in this file carries `if:` or `continue-on-error:`, so a
      # failure in the shared step aborts the job and skips every APK publish
      # step below it. `bundleRelease` had never run in this repo, and its first
      # execution would have sat upstream of the pilot's only way to get the app.
      #
      # Ordering is what makes the promise true, not the comment. The bundle is
      # built after the APK is on S3 — see "Build Play bundle" at the end.
      - name: Build signed release APK
        working-directory: src/clients/mobile-web/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: |
          APK=src/clients/mobile-web/android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # Version + signing identity of the artifact, for the release evidence.
      - name: Record APK identity (version, signer, sha256)
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK_PATH" | grep -E "certificate SHA-256 digest|Signer #1" | tee /tmp/apk-certs.txt
          "$BT/aapt2" dump badging "$APK_PATH" | grep -E "^package:" | tee /tmp/apk-badging.txt
          {
            echo "### APK identity"
            echo "- git sha: \`${GITHUB_SHA}\`"
            echo "- apk sha256: \`$(sha256sum "$APK_PATH" | cut -d' ' -f1)\`"
            echo "- web manifest sha256: \`$(sha256sum src/clients/mobile-web/web-dist.sha256 | cut -d' ' -f1)\`"
            echo '```'; cat /tmp/apk-badging.txt /tmp/apk-certs.txt; echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # PRIVATE DISTRIBUTION. The APK goes to the app bucket only, whose /apk/*
      # path sits behind the CloudFront basic-auth function (shramsafal-apk-auth,
      # dist EFLL3RCLOOO60). It is deliberately NOT copied to the marketing
      # bucket or linked from shramsafal.in: on 2026-10-02 a public APK link was
      # found on the marketing site and closed. Do not re-add it.
      - name: Upload APK to S3 (private app bucket, versioned and latest)
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          aws s3 cp "$APK_PATH" \
            "s3://shramsafal-app-prod/apk/shramsafal-${SHA_SHORT}.apk" \
            --content-type application/vnd.android.package-archive \
            --cache-control "max-age=31536000"
          aws s3 cp "$APK_PATH" \
            "s3://shramsafal-app-prod/apk/shramsafal-latest.apk" \
            --content-type application/vnd.android.package-archive \
            --cache-control "no-cache, no-store, must-revalidate"
          echo "APK published (private, basic-auth): https://app.shramsafal.in/apk/shramsafal-${SHA_SHORT}.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shramsafal-release-apk
          path: src/clients/mobile-web/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # --- Google Play bundle -------------------------------------------------
      # Everything below runs only once the APK is already published to S3 and
      # uploaded as an artifact. That ORDER is the guarantee: if the bundle
      # fails, the farmer-facing APK has already shipped, and the run still goes
      # red so the failure is visible rather than swallowed. `continue-on-error`
      # is deliberately NOT used — it would trade that visibility away for
      # nothing, since ordering alone already protects the APK.
      #
      # Gradle reuses the compile and R8 outputs from assembleRelease above, so
      # the APK and the bundle are still built from identical inputs.
      #
      # The AAB is NOT uploaded to S3. Those are public download URLs served as
      # application/vnd.android.package-archive, and an .aab is not installable
      # on a phone — publishing one there would hand farmers a file that cannot
      # open. It goes to Play Console, by hand, from the workflow artifact.
      - name: Build Play bundle
        working-directory: src/clients/mobile-web/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify AAB
        run: |
          AAB=src/clients/mobile-web/android/app/build/outputs/bundle/release/app-release.aab
          ls -lh "$AAB"
          SZ=$(wc -c < "$AAB")
          if [ "$SZ" -lt 500000 ]; then
            echo "::error title=AAB looks wrong::app-release.aab is only ${SZ} bytes"
            exit 1
          fi
          echo "AAB ready for Play Console upload."

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shramsafal-release-aab
          path: src/clients/mobile-web/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
