name: android-release

on:
  # NOTE: there is deliberately no `version_bump` input. One used to be declared
  # here and no step ever read it, so choosing "patch" in the Run-workflow dialog
  # silently did nothing. The version is a COMMIT: edit versionCode / versionName
  # in src/clients/mobile-web/android/app/build.gradle and push that.
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build & publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/clients/mobile-web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      # Use the pre-installed Android SDK on ubuntu-latest
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install sync-contract deps (tolerant — lock omits Linux-only @emnapi optional deps)
        working-directory: sync-contract
        run: npm install --no-audit --no-fund

      - name: Install mobile-web deps
        working-directory: src/clients/mobile-web
        run: npm ci

      - name: Build web assets
        working-directory: src/clients/mobile-web
        env:
          # Backend API base URL — baked into the bundle so the packaged APK
          # talks to prod (not https://localhost). Capacitor serves the app from
          # https://localhost with NO server.url, so without this resolveApiBaseUrl()
          # returns '' → all API calls hit the WebView origin and fail (no login,
          # no sync). .env.production carries this for web builds but is gitignored
          # / absent in CI, so CI must set it explicitly. Public URL, not a secret.
          VITE_AGRISYNC_API_URL: "https://api.shramsafal.in"
          # Google Maps JS key — baked into the bundle at build time so the
          # farm-boundary map + GPS render inside the APK. Public client key
          # (protected by HTTP-referrer restrictions, not secrecy); stored as a
          # repo secret so CI builds carry it (.env.local is gitignored / absent
          # in CI). See src/clients/mobile-web/.env.production.example.
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          # DFES companion (spec: dfes-companion-2026-07-11) — read via the
          # isEnabled('VITE_...') helper in src/app/featureFlags.ts. Vite bakes
          # import.meta.env at BUILD time, so a web-side flag flip never reaches
          # an already-installed APK; CI must set the release value explicitly.
          # Founder Acceptance Gate for the companion covers these five.
          VITE_UNDERSTANDING_METER: "1"
          VITE_STAGE_QUESTIONS: "1"
          VITE_DISCIPLINE_SYSTEM: "1"
          # Phase 4 voice-first continuity. Held back pending founder decision
          # (see wave-0.4 handoff); founder ruling 2026-08-16 turns it ON for
          # the pilot. Must match release.yml so browser and APK agree.
          VITE_VOICE_CONTINUITY: "1"
          VITE_DAILY_LOOP: "1"
          VITE_TASK_CLOSE_CONFIRM: "1"
          # Founder decision 2026-07-19 (see featureFlags.ts) pauses the rich-day
          # unlock counter. This flag defaults OFF when unset — omitting it here
          # would silently bring the counter back in the shipped APK.
          VITE_UNLOCK_COUNTER_PAUSED: "1"
          # Dev/test-only switches — must ship OFF in the release build.
          VITE_SIMULATE_UNLOCK: "0"
          VITE_INTELLIGENCE_INSIGHTS: "0"
        run: npm run build

      - name: Cap sync android
        working-directory: src/clients/mobile-web
        run: npx cap sync android

      # The signing key is NOT in the repo — it is this secret plus the founder's
      # offline backup. Everything below is a guard, because every failure mode
      # here used to surface hundreds of Gradle tasks later as a misleading
      # "keystore password was incorrect", or not at all.
      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS=src/clients/mobile-web/android/app/shramsafal-release.keystore
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          SZ=$(wc -c < "$KS")
          echo "Keystore decoded: ${SZ} bytes"
          # `base64 -d` exits 0 on an empty or unset secret and writes a 0-byte
          # file. Without this check that becomes a Gradle error 500 tasks later.
          if [ "$SZ" -lt 1000 ]; then
            echo "::error title=KEYSTORE_BASE64 empty or truncated::Decoded keystore is ${SZ} bytes. Regenerate with 'base64 -w0 <keystore>' and reset the KEYSTORE_BASE64 secret."
            exit 1
          fi
          # app/build.gradle defaults these to "" when unset, which produces the
          # same misleading downstream error as a wrong password.
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error title=Signing password secret missing::KEYSTORE_PASSWORD and/or KEY_PASSWORD is unset."
            exit 1
          fi
          # Catches a half-finished key rotation (new keystore, old password) in
          # seconds rather than at the end of a 20-minute build. The alias is
          # fixed by app/build.gradle.
          #
          # keytool writes its failure diagnostic to STDOUT, not stderr, so the
          # earlier `> /dev/null` form silently discarded the one line that says
          # what went wrong — leaving a bare non-zero exit and making this the
          # only guard here without a named message. Capture it instead.
          if ! KT_OUT=$(keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias shramsafal 2>&1); then
            echo "::error title=Keystore does not match KEYSTORE_PASSWORD::${KT_OUT}"
            exit 1
          fi
          echo "Keystore opens with the supplied password, and contains alias 'shramsafal'."

      - name: Grant Gradle execute permission
        working-directory: src/clients/mobile-web/android
        run: chmod +x gradlew

      # The APK is built and published ALONE, before the Play bundle is even
      # attempted. `-q` is deliberately not used: it hides which task failed.
      #
      # These were briefly one command (`assembleRelease bundleRelease`) with a
      # comment claiming a bundle problem could never block the APK. That was
      # false: no step in this file carries `if:` or `continue-on-error:`, so a
      # failure in the shared step aborts the job and skips every APK publish
      # step below it. `bundleRelease` had never run in this repo, and its first
      # execution would have sat upstream of the pilot's only way to get the app.
      #
      # Ordering is what makes the promise true, not the comment. The bundle is
      # built after the APK is on S3 — see "Build Play bundle" at the end.
      - name: Build signed release APK
        working-directory: src/clients/mobile-web/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: |
          APK=src/clients/mobile-web/android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Upload APK to S3 (versioned + latest + marketing site)
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          # app bucket — versioned + latest
          aws s3 cp "$APK_PATH" \
            "s3://shramsafal-app-prod/apk/shramsafal-${SHA_SHORT}.apk" \
            --content-type application/vnd.android.package-archive \
            --cache-control "max-age=31536000"
          aws s3 cp "$APK_PATH" \
            "s3://shramsafal-app-prod/apk/shramsafal-latest.apk" \
            --content-type application/vnd.android.package-archive \
            --cache-control "no-cache, no-store, must-revalidate"
          # marketing site — /download/ path so shramsafal.in/download/shramsafal-latest.apk works
          aws s3 cp "$APK_PATH" \
            "s3://shramsafal-marketing-prod/download/shramsafal-latest.apk" \
            --content-type application/vnd.android.package-archive \
            --cache-control "no-cache, no-store, must-revalidate"
          # Invalidate marketing site CloudFront for the download path
          aws cloudfront create-invalidation \
            --distribution-id E2M06A2B71ZW1O \
            --paths "/download/shramsafal-latest.apk" \
            --output text --query "Invalidation.Id"
          echo "✅ APK published:"
          echo "   Download: https://shramsafal.in/download/shramsafal-latest.apk"
          echo "   Versioned: https://app.shramsafal.in/apk/shramsafal-${SHA_SHORT}.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shramsafal-release-apk
          path: src/clients/mobile-web/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # --- Google Play bundle -------------------------------------------------
      # Everything below runs only once the APK is already published to S3 and
      # uploaded as an artifact. That ORDER is the guarantee: if the bundle
      # fails, the farmer-facing APK has already shipped, and the run still goes
      # red so the failure is visible rather than swallowed. `continue-on-error`
      # is deliberately NOT used — it would trade that visibility away for
      # nothing, since ordering alone already protects the APK.
      #
      # Gradle reuses the compile and R8 outputs from assembleRelease above, so
      # the APK and the bundle are still built from identical inputs.
      #
      # The AAB is NOT uploaded to S3. Those are public download URLs served as
      # application/vnd.android.package-archive, and an .aab is not installable
      # on a phone — publishing one there would hand farmers a file that cannot
      # open. It goes to Play Console, by hand, from the workflow artifact.
      - name: Build Play bundle
        working-directory: src/clients/mobile-web/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify AAB
        run: |
          AAB=src/clients/mobile-web/android/app/build/outputs/bundle/release/app-release.aab
          ls -lh "$AAB"
          SZ=$(wc -c < "$AAB")
          if [ "$SZ" -lt 500000 ]; then
            echo "::error title=AAB looks wrong::app-release.aab is only ${SZ} bytes"
            exit 1
          fi
          echo "AAB ready for Play Console upload."

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shramsafal-release-aab
          path: src/clients/mobile-web/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
