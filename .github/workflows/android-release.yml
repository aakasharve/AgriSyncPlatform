name: android-release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (none | patch | minor)'
        required: false
        default: 'none'
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build & publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/clients/mobile-web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      # Use the pre-installed Android SDK on ubuntu-latest
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install sync-contract deps (tolerant — lock omits Linux-only @emnapi optional deps)
        working-directory: sync-contract
        run: npm install --no-audit --no-fund

      - name: Install mobile-web deps
        working-directory: src/clients/mobile-web
        run: npm ci

      - name: Build web assets
        working-directory: src/clients/mobile-web
        env:
          # Backend API base URL — baked into the bundle so the packaged APK
          # talks to prod (not https://localhost). Capacitor serves the app from
          # https://localhost with NO server.url, so without this resolveApiBaseUrl()
          # returns '' → all API calls hit the WebView origin and fail (no login,
          # no sync). .env.production carries this for web builds but is gitignored
          # / absent in CI, so CI must set it explicitly. Public URL, not a secret.
          VITE_AGRISYNC_API_URL: "https://api.shramsafal.in"
          # Google Maps JS key — baked into the bundle at build time so the
          # farm-boundary map + GPS render inside the APK. Public client key
          # (protected by HTTP-referrer restrictions, not secrecy); stored as a
          # repo secret so CI builds carry it (.env.local is gitignored / absent
          # in CI). See src/clients/mobile-web/.env.production.example.
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          # DFES companion (spec: dfes-companion-2026-07-11) — read via the
          # isEnabled('VITE_...') helper in src/app/featureFlags.ts. Vite bakes
          # import.meta.env at BUILD time, so a web-side flag flip never reaches
          # an already-installed APK; CI must set the release value explicitly.
          # Founder Acceptance Gate for the companion covers these five.
          VITE_UNDERSTANDING_METER: "1"
          VITE_STAGE_QUESTIONS: "1"
          VITE_DISCIPLINE_SYSTEM: "1"
          VITE_DAILY_LOOP: "1"
          VITE_TASK_CLOSE_CONFIRM: "1"
          # Founder decision 2026-07-19 (see featureFlags.ts) pauses the rich-day
          # unlock counter. This flag defaults OFF when unset — omitting it here
          # would silently bring the counter back in the shipped APK.
          VITE_UNLOCK_COUNTER_PAUSED: "1"
          # Dev/test-only switches — must ship OFF in the release build.
          VITE_SIMULATE_UNLOCK: "0"
          VITE_INTELLIGENCE_INSIGHTS: "0"
        run: npm run build

      - name: Cap sync android
        working-directory: src/clients/mobile-web
        run: npx cap sync android

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d \
            > src/clients/mobile-web/android/app/shramsafal-release.keystore
          echo "Keystore decoded: $(wc -c < src/clients/mobile-web/android/app/shramsafal-release.keystore) bytes"

      - name: Grant Gradle execute permission
        working-directory: src/clients/mobile-web/android
        run: chmod +x gradlew

      - name: Build signed release APK
        working-directory: src/clients/mobile-web/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -q

      - name: Verify APK
        run: |
          APK=src/clients/mobile-web/android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Upload APK to S3 (versioned + latest + marketing site)
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          # app bucket — versioned + latest
          aws s3 cp "$APK_PATH" \
            "s3://shramsafal-app-prod/apk/shramsafal-${SHA_SHORT}.apk" \
            --content-type application/vnd.android.package-archive \
            --cache-control "max-age=31536000"
          aws s3 cp "$APK_PATH" \
            "s3://shramsafal-app-prod/apk/shramsafal-latest.apk" \
            --content-type application/vnd.android.package-archive \
            --cache-control "no-cache, no-store, must-revalidate"
          # marketing site — /download/ path so shramsafal.in/download/shramsafal-latest.apk works
          aws s3 cp "$APK_PATH" \
            "s3://shramsafal-marketing-prod/download/shramsafal-latest.apk" \
            --content-type application/vnd.android.package-archive \
            --cache-control "no-cache, no-store, must-revalidate"
          # Invalidate marketing site CloudFront for the download path
          aws cloudfront create-invalidation \
            --distribution-id E2M06A2B71ZW1O \
            --paths "/download/shramsafal-latest.apk" \
            --output text --query "Invalidation.Id"
          echo "✅ APK published:"
          echo "   Download: https://shramsafal.in/download/shramsafal-latest.apk"
          echo "   Versioned: https://app.shramsafal.in/apk/shramsafal-${SHA_SHORT}.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shramsafal-release-apk
          path: src/clients/mobile-web/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
