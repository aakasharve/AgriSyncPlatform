name: eslint

on:
  push:
    branches: [main]
    paths:
      - 'src/clients/mobile-web/**'
      - 'src/clients/admin-web/**'
      - '.github/workflows/eslint.yml'
  pull_request:
    # Sub-plan 04 close-out — also gate PRs that target akash_edits so
    # the integration branch's mid-cycle PRs (e.g. claude/sp04-frontend)
    # surface their lint + size + storage-discipline checks before merge.
    branches: [main]
    paths:
      - 'src/clients/mobile-web/**'
      - 'src/clients/admin-web/**'
      - '.github/workflows/eslint.yml'
  workflow_dispatch:

jobs:
  mobile-web-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/clients/mobile-web
    steps:
      # T-IGH-DEXIE-V23-COLLISION — fetch-depth: 0 is REQUIRED for the
      # check:dexie-version step below, not optional. That check compares
      # this branch's DATABASE_VERSION against every other visible ref; the
      # default shallow, single-ref checkout leaves it nothing to compare
      # against. See scripts/check-dexie-version.mjs's own header for the
      # incident (two branches both declared version 23 for different
      # schemas — a collision no single-branch gate could ever see) and
      # task-7-report.md / task-9-report.md under
      # .superpowers/sdd/FINAL_SERVER_AUTHORITATIVE_EXECUTION_PLAN/ for how
      # this was verified before being wired here.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/clients/mobile-web/package-lock.json
      - run: npm ci
      # Sub-plan 04 Task 10 — ratchet floor. Started at 9999 (Sub-plan 01
       # informational mode), tightened to 600 here so any new warning
       # blocks CI. Sub-plan 05 will drive it to 50 then 0; the
       # T-IGH-04-LINT-RATCHET pending task tracks the per-rule cleanup
       # required to land each step.
      - run: npx eslint --max-warnings 600 "src/**/*.{ts,tsx}"
      - run: npm run check:file-sizes
      # Sub-plan 04 Task 3 — localStorage architecture gate (strict; fails on
      # any new violation outside the named allow-list).
      - run: npm run check:storage-discipline
      # T-IGH-DEXIE-V23-COLLISION — cross-branch Dexie schema-version guard.
      # Needs fetch-depth: 0 above; without it (or if ref-visibility breaks
      # some other way in the future) this step's cross-branch half is inert.
      #
      # scripts/check-dexie-version.mjs is owned by another agent and is not
      # modified here. Verified before this was wired (task-9-report.md):
      # when it cannot see other refs, it prints "cross-branch: SKIPPED" but
      # STILL exits 0 and prints "OK" — contradicting its own header comment
      # ("does NOT pass quietly in that case") and the report that shipped
      # with it. That is reported to the script's owner as a finding, not
      # fixed here. Because "a version-collision guard that silently passes
      # because it could not fetch" is exactly the defect this whole gate
      # exists to prevent, the wiring below does not simply trust the
      # script's own exit code — it separately checks the printed output for
      # the SKIPPED marker and fails the job if found, regardless of what the
      # script itself exited with. This is workflow-level wiring, not a
      # script edit: it fails CLOSED if fetch-depth ever regresses or ref
      # visibility breaks for any other reason, instead of quietly reporting
      # green having compared nothing.
      - name: Dexie cross-branch schema-version check
        run: |
          set +e
          npm run check:dexie-version > /tmp/dexie-version.log 2>&1
          code=$?
          cat /tmp/dexie-version.log
          if [ "$code" -ne 0 ]; then
            echo "::error::check:dexie-version failed (exit $code) -- see the collision/coherence details above."
            exit "$code"
          fi
          if grep -q "cross-branch: SKIPPED" /tmp/dexie-version.log; then
            echo "::error::check:dexie-version's cross-branch half did not run (see 'SKIPPED' above) even though it exited 0. Refusing to treat an unfetched comparison as a pass -- this means fetch-depth: 0 above did not make other branches visible. Investigate before trusting this job's result."
            exit 1
          fi

  admin-web-lint:
    runs-on: ubuntu-latest
    # No if-guard: hashFiles() is a step-time function (the runner's
    # workspace doesn't exist at job-evaluation time, which causes the
    # whole workflow to fail YAML validation with "Unrecognized function:
    # hashFiles"). admin-web's package.json has shipped; the conditional
    # was defensive scaffolding from before that and broke the workflow.
    defaults:
      run:
        working-directory: src/clients/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/clients/admin-web/package-lock.json
      # The lockfile is generated on developer Windows machines; CI is Linux,
      # and the platform-specific @emnapi optional native deps (lightningcss
      # fast-path) don't round-trip across the two without WSL/Docker. `npm ci`
      # (even with `--omit=optional`) fails because it validates the lockfile is
      # in sync BEFORE omitting. Tolerant `npm install` — the pattern already
      # used for sync-contract in android-release/ci-gate/frontend-ci — installs
      # cleanly; these are optional native fast-paths that fall back to the JS
      # implementation. Closes the recurring admin-web-lint @emnapi drift failure.
      - run: npm install --no-audit --no-fund
      - run: npx eslint --max-warnings 9999 .
