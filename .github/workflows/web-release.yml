# spec: 2026-08-25-prod-cutover-waves - T1.6
#
# PROMOTE ONLY - never builds. Publishes the web bundle that release-build already
# produced and verified, to app.shramsafal.in.
#
# 🛑 WORKFLOW_DISPATCH ONLY. NEVER `on: push`.
# The web step is ONE-WAY: a device that loads a Dexie-24 bundle cannot open its
# database on a bundle declaring 22, and no VersionError recovery path exists in
# infrastructure/storage/. Publishing ahead of the founder gate and ahead of the API
# deploy is exactly the ordering the plan forbids.
#
# Safety rails, in order, all before any AWS call:
#   1. dry_run defaults to TRUE. A real publish needs dry_run=false AND confirm=PUBLISH.
#   2. the build run must be the `release-build` workflow, concluded success, and have
#      built the SAME commit this workflow is dispatched on (the frozen SHA);
#   3. the downloaded bundle must match the build's sha256 manifest, file for file;
#   4. the bundle must carry the prod API origin.
# Dispatch it with `--ref <frozen protected-main sha>`.
name: web-release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Run id of the successful release-build run on THIS commit'
        type: string
        required: true
      dry_run:
        description: 'Verify only - touch nothing (default). Set false to publish.'
        type: boolean
        default: true
      confirm:
        description: 'To publish (dry_run=false) type PUBLISH - one-way (Dexie forward-only)'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: web-release
  cancel-in-progress: false

jobs:
  promote:
    name: Verify and promote the built web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Confirmation for a real publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" != "true" ] && [ "$CONFIRM" != "PUBLISH" ]; then
            echo "::error::Refusing to publish. dry_run=false needs confirm=PUBLISH. The web step cannot be rolled back."
            exit 1
          fi
          echo "mode: dry_run=$DRY_RUN"

      - uses: actions/checkout@v4

      - name: Verify the build run
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          gh run view "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,conclusion,headSha > run.json
          python3 ops/release/release_verify.py run run.json release-build "$GITHUB_SHA"

      - name: Download the built web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: src/clients/mobile-web
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Verify the bundle against the build manifest
        working-directory: src/clients/mobile-web
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/ops/release/release_verify.py" bundle dist web-dist.sha256
          grep -rqF 'https://api.shramsafal.in' dist/ || { echo "::error::bundle lacks the prod API origin"; exit 1; }
          echo "manifest sha256: $(sha256sum web-dist.sha256 | cut -d' ' -f1)"

      - name: Dry run stops here
        if: ${{ inputs.dry_run }}
        run: echo "dry_run=true - verified only. No AWS credentials were configured and nothing was published."

      - name: Configure AWS credentials
        if: ${{ !inputs.dry_run }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Publish to S3 + invalidate CloudFront
        if: ${{ !inputs.dry_run }}
        working-directory: src/clients/mobile-web
        run: bash scripts/deploy-s3.sh

      - name: Record the published bundle entry point
        if: ${{ !inputs.dry_run }}
        working-directory: src/clients/mobile-web
        run: |
          set -euo pipefail
          grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | sort -u
          echo "Record this in DEPLOYMENT_TRACKER.md alongside the backend SHA."
