name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (true/false)"
        default: "true"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build .NET artifacts
        run: |
          dotnet restore src/AgriSync.sln
          dotnet publish src/AgriSync.Bootstrapper/AgriSync.Bootstrapper.csproj \
            --configuration Release \
            --output ./artifacts/dotnet

      - name: Build frontend
        # spec: dfes-companion-2026-07-11 (wave-0.3, wave-0.4) — vite.config.ts
        # fails a production `vite build` if VITE_AGRISYNC_API_URL is unset (nine
        # client call sites would otherwise silently fall back to
        # http://localhost:5048). Public prod URL, not a secret — matches
        # android-release.yml's value.
        #
        # DFES companion flags (wave-0.4): this is the web production build —
        # it MUST carry the same companion flag set as android-release.yml's
        # "Build web assets" step. Vite bakes import.meta.env at BUILD time, so
        # leaving these unset here (as before) ships a web bundle where the
        # companion is silently OFF while the same commit's APK has it ON —
        # one farmer, two truths. Keep both files in sync; see featureFlags.ts.
        working-directory: src/clients/mobile-web
        env:
          VITE_AGRISYNC_API_URL: "https://api.shramsafal.in"
          VITE_UNDERSTANDING_METER: "1"
          VITE_STAGE_QUESTIONS: "1"
          VITE_DISCIPLINE_SYSTEM: "1"
          # Phase 4 voice-first continuity. Founder ruling 2026-08-16 turns it
          # ON for the pilot (previously held back pending his decision).
          VITE_VOICE_CONTINUITY: "1"
          VITE_DAILY_LOOP: "1"
          VITE_TASK_CLOSE_CONFIRM: "1"
          # Founder decision 2026-07-19 pauses the rich-day unlock counter.
          # Defaults OFF when unset — omitting it here would silently bring
          # the counter back in the shipped web build. Matches android-release.yml.
          VITE_UNLOCK_COUNTER_PAUSED: "1"
          # Dev/test-only switches — must ship OFF in the release build.
          VITE_SIMULATE_UNLOCK: "0"
          VITE_INTELLIGENCE_INSIGHTS: "0"
        run: |
          npm ci
          npm run build

      - name: Install git-cliff
        run: |
          curl -sSfL https://github.com/orhun/git-cliff/releases/download/v2.4.0/git-cliff-v2.4.0-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          chmod +x git-cliff-*/git-cliff
          mv git-cliff-*/git-cliff /usr/local/bin/git-cliff

      - name: Generate changelog
        run: |
          git-cliff --unreleased --strip all -o RELEASE_NOTES.md 2>/dev/null || \
          git log --oneline --no-merges $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD > RELEASE_NOTES.md

      - name: Create GitHub Release
        if: github.event.inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "AgriSync $TAG" \
            --notes-file RELEASE_NOTES.md \
            --template .github/release-template.md \
            artifacts/dotnet/*.dll 2>/dev/null || \
          gh release create "$TAG" \
            --title "AgriSync $TAG" \
            --notes-file RELEASE_NOTES.md

      - name: Dry run summary
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "DRY RUN — would create release with:"
          cat RELEASE_NOTES.md
