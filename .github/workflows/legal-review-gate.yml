# spec: 2026-08-25-prod-cutover-waves
#
# Copy-review registry gate. ops/release/copy-review-registry.json lists the user-facing
# legal / consent / privacy copy files that need counsel review, with a per-file reviewStatus
# and a registry-level audience (founder_testing | real_farmers). ops/release/copy_review_check.mjs
# compares file hashes against that registry. THAT IS ALL IT MEASURES. A green run is never
# evidence that any copy is legally valid, compliant, or reviewed by counsel; sign-off records
# live in the private review records and the registry only holds an identifier pointing at them.
# How to sign off a file or change the audience: ops/release/COPY_REVIEW.md.
#
# Two jobs (ids unchanged from the previous marker-counting version):
#
#   warn-on-tag  — every push / PR. Report mode: prints how many files await counsel review.
#                  Fails only on registry-integrity problems: a listed file is missing, a
#                  covered copy file is not in the registry, a signed_off file's hash no longer
#                  matches reviewedSha256, or the registry itself is malformed.
#
#   block-on-tag — only when github.ref == 'refs/heads/prod-deploy'. Enforce mode: everything
#                  above, plus when audience is real_farmers it fails unless every listed file
#                  is signed_off with a matching hash and a non-empty signOffRef. There is no
#                  date logic; the audience is changed only by an explicit reviewed commit.

name: legal-review-gate

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, prod-deploy]

permissions:
  contents: read

jobs:
  warn-on-tag:
    name: Copy-review registry (report mode, any branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Registry check tests (gate fires and passes)
        working-directory: ops/release
        run: node --test copy_review_check.test.mjs
      - name: Report copy-review registry
        run: node ops/release/copy_review_check.mjs --mode report

  block-on-tag:
    name: Copy-review registry (enforce mode, prod-deploy)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod-deploy'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Registry check tests (gate fires and passes)
        working-directory: ops/release
        run: node --test copy_review_check.test.mjs
      - name: Enforce copy-review registry
        run: node ops/release/copy_review_check.mjs --mode enforce
